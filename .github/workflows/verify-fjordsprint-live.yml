name: Kontroller publisert Fjordsprint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-fjordsprint-live.yml']
  workflow_run:
    workflows: ['Publiser prosjektsiden']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fjordsprint-live
  cancel-in-progress: true
jobs:
  public-site:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Kontroller offentlig spilladresse uten å sende inn resultater
        env:
          GAME_URL: https://rolfss.github.io/Click-here-for-newest-projects/fjordsprint/
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          base = os.environ['GAME_URL']
          targets = {
              'index.html': b'v2.0 / 2026',
              'main.js': b'./leaderboard-ui.js',
              'leaderboard.js': b'fjordsprint-scores-v2',
              'leaderboard-ui.js': b'72',
              'revival.css': b'Saksrally 2.0',
              'vendor/three.module.js': b'Three.js',
          }
          results = []
          for path, marker in targets.items():
              error = None
              for attempt in range(12):
                  try:
                      request = Request(base + path + '?release-check=2', headers={'User-Agent': 'Fjordsprint-publication-check'})
                      with urlopen(request, timeout=12) as response:
                          data = response.read()
                          assert response.status == 200, response.status
                          assert marker in data, f'Expected release marker missing in {path}'
                          results.append({'url': base + path, 'status': response.status, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
                      break
                  except Exception as exc:
                      error = exc
                      if attempt == 11:
                          raise RuntimeError(f'Public release check failed for {path}: {error}') from exc
                      time.sleep(5)
          Path('live-check.json').write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
          PY
      - name: Lagre kontrollresultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fjordsprint-live-check
          path: live-check.json
          retention-days: 3
