name: Kontroller publisert Fjordsprint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-fjordsprint-live.yml']
  workflow_run:
    workflows: ['Publiser prosjektsiden']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fjordsprint-live
  cancel-in-progress: true
jobs:
  public-site:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Kontroller offentlige spillfiler mot den publiserte kildekoden
        env:
          GAME_URL: https://rolfss.github.io/Click-here-for-newest-projects/fjordsprint/
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          base = os.environ['GAME_URL']
          root = Path('fjordsprint/dist')
          # Exact source hashes, including mobile controls and road graphics.
          # These requests are read-only and never submit scores or names.
          targets = ['index.html', 'main.js', 'rally-physics.js', 'rally-world.js',
                     'rally-rules.js', 'rally-ui.js', 'rally-questions.js',
                     'smoothing.js', 'hso-world.js', 'hso-data.js', 'hso-ui.js',
                     'hso.css', 'rally.css', 'assets/sykehuspartner.png',
                     'vendor/three.module.js', 'mobile-drive.js',
                     'mobile-controls.js', 'polish-world.js', 'polish.css']
          results = []
          try:
              for path in targets:
                  expected = hashlib.sha256((root / path).read_bytes()).hexdigest()
                  for attempt in range(12):
                      try:
                          url = base + path + '?release-check=' + os.environ['RELEASE_SHA'][:12]
                          request = Request(url, headers={'User-Agent': 'Fjordsprint-publication-check', 'Cache-Control': 'no-cache'})
                          with urlopen(request, timeout=12) as response:
                              data = response.read()
                              actual = hashlib.sha256(data).hexdigest()
                              assert response.status == 200, response.status
                              assert actual == expected, f'Public bytes differ for {path}: {actual} != {expected}'
                              result = {'url': base + path, 'status': 200, 'bytes': len(data), 'sha256': actual, 'matchesSource': True}
                              results.append(result)
                              print(json.dumps(result), flush=True)
                          break
                      except Exception:
                          if attempt == 11:
                              raise
                          time.sleep(5)
          finally:
              Path('live-check.json').write_text(json.dumps({'commit': os.environ['RELEASE_SHA'], 'checked': len(results), 'expected': len(targets), 'results': results}, indent=2))
          PY
      - name: Lagre kontrollresultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fjordsprint-live-check
          path: live-check.json
          retention-days: 3
