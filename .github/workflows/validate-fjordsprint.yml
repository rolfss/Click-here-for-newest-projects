name: Kontroller Fjordsprint
on:
  push:
    branches: [main, 'work/fjordsprint-*']
    paths: ['fjordsprint/**', '.github/workflows/validate-fjordsprint.yml']
  pull_request:
    paths: ['fjordsprint/**', '.github/workflows/validate-fjordsprint.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fjordsprint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile-portrait, mobile-landscape]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Spill- og lagringstester
        working-directory: fjordsprint
        run: npm test
      - name: Installer nettlesertestverktøy
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Prøv kjøring, toppliste, mobilstyring og grafikk
        working-directory: fjordsprint
        env:
          FJORDSPRINT_VIEWPORT: ${{ matrix.viewport }}
        run: |
          python3 tests/browser-smoke.py
          python3 tests/mobile-polish.py
      - name: Arkiver kilde og faktiske skjermbilder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fjordsprint-review-${{ matrix.viewport }}
          path: |
            fjordsprint/
            site/index.html
            scripts/check-pages.mjs
            .github/workflows/deploy-pages.yml
          include-hidden-files: true
          retention-days: 3
