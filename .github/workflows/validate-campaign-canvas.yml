name: Validate Campaign Canvas

on:
  push:
    paths:
      - "campaign-canvas/**"
      - ".github/workflows/validate-campaign-canvas.yml"
  pull_request:
    paths:
      - "campaign-canvas/**"
      - ".github/workflows/validate-campaign-canvas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campaign-canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
