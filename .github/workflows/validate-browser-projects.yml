name: Valider nettleserprosjekter

on:
  pull_request:
    paths:
      - "site/**"
      - "archive-assist/**"
      - "metaready/**"
      - "lumen-relay/**"
      - "brukerstottejakten/**"
      - "vedtak/**"
      - "noark-assistent/**"
      - "arkivmuseet/**"
      - ".github/workflows/validate-browser-projects.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v6

      - name: Sett opp Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Kjør tester for Archive Assist
        working-directory: ./archive-assist
        run: npm test && npm run build

      - name: Kjør tester for MetaReady
        working-directory: ./metaready
        run: npm test

      - name: Kjør tester for Lumen Relay
        working-directory: ./lumen-relay
        run: npm test && npm run check

      - name: Kjør tester for Brukerstøttejakten
        working-directory: ./brukerstottejakten
        run: npm test && npm run check

      - name: Kjør tester for VEDTAK!
        working-directory: ./vedtak
        run: npm test && npm run check

      - name: Kjør tester for Noark 5-arkivassistenten
        working-directory: ./noark-assistent
        run: npm run validate

      - name: Sett opp pnpm for Arkivmuseet
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Valider og bygg Arkivmuseet
        working-directory: ./arkivmuseet
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
