name: Sett sammen Saksrally 2.0
on:
  push:
    branches: ['work/fjordsprint-72h-20261016']
    paths: ['.github/workflows/assemble-fjordsprint.yml']
permissions:
  contents: write
jobs:
  assemble-and-test:
    if: github.ref == 'refs/heads/work/fjordsprint-72h-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Kontroller og pakk ut den lokale kildeoppdateringen
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, shutil
          from pathlib import Path
          transfer = Path('fjordsprint/.release-transfer')
          parts = [ (transfer / f'{n}.b64').read_text().strip() for n in range(1,5) ]
          # Correct one verified transport-only insertion; the payload hash below is authoritative.
          assert parts[2][4279] == 'J' and len(parts[2]) == 12001
          parts[2] = parts[2][:4279] + parts[2][4280:]
          raw = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '259d6d5d88a5f4ee0edf5fff60cb11b94fd63b791dfc034ef75d107f389b49a8'
          rows = json.loads(raw)
          allowed = set('''fjordsprint/RELEASE-NOTES.md fjordsprint/dist/director.js fjordsprint/dist/leaderboard-ui.js fjordsprint/dist/leaderboard.js fjordsprint/dist/pace-ghost.js fjordsprint/dist/revival.css fjordsprint/score-server/README.md fjordsprint/score-server/worker.mjs fjordsprint/score-server/wrangler.jsonc fjordsprint/tests/browser-smoke.py fjordsprint/tests/revival.test.mjs fjordsprint/tests/server.test.mjs fjordsprint/READ-ME.md fjordsprint/dist/index.html fjordsprint/dist/main.js fjordsprint/dist/physics.js fjordsprint/dist/tracks.js fjordsprint/dist/world.js fjordsprint/package.json site/index.html'''.split())
          assert len(rows) == 20 and {r['p'] for r in rows} == allowed
          staged = []
          for row in rows:
              p = Path(row['p'])
              old = p.read_bytes().decode('utf-8') if p.exists() else ''
              assert not p.is_symlink()
              if row['before'] is None:
                  assert not p.exists(), f'New path already exists: {p}'
              else:
                  assert hashlib.sha256(old.encode()).hexdigest() == row['before'], f'Concurrent change: {p}'
              if 'content' in row:
                  new = row['content']
              else:
                  chunks, end = [], 0
                  for start, stop, replacement in row['edits']:
                      assert end <= start <= stop <= len(old)
                      chunks.extend([old[end:start], replacement])
                      end = stop
                  chunks.append(old[end:])
                  new = ''.join(chunks)
              assert hashlib.sha256(new.encode()).hexdigest() == row['after'], f'Output mismatch: {p}'
              staged.append((p,new))
          for p,new in staged:
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(new)
              print('Verified:',p)
          shutil.rmtree(transfer)
          PY
      - name: Kjør alle spill- og lagringstester
        working-directory: fjordsprint
        run: npm test
      - name: Lagre kontrollerte kildefiler på arbeidsgrenen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fjordsprint site/index.html
          git commit -m 'Gjenoppliv Fjordsprint som Saksrally 2.0 med 72-timers navneliste'
          git push origin HEAD:work/fjordsprint-72h-20261016
      - name: Installer nettlesertestverktøy
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Prøv desktop, mobil og hele rekordflyten
        working-directory: fjordsprint
        run: python3 tests/browser-smoke.py
      - name: Arkiver kilde og faktiske skjermbilder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fjordsprint-browser-review
          path: |
            fjordsprint/
            site/index.html
          include-hidden-files: true
          retention-days: 3
