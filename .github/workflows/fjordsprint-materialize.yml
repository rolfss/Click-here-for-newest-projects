name: Klargjør verifiserte spillrettelser
on:
  push:
    branches: [work/fjordsprint-grip-hso]
    paths: [.github/scripts/fjordsprint-materialize.py, .github/workflows/fjordsprint-materialize.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lag bare innholdsadresserte objekter, ikke publiser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/work/fjordsprint-grip-hso
          python3 .github/scripts/fjordsprint-materialize.py
