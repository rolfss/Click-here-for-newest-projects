name: Publiser prosjektsiden

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/build-news.py"
      - "scripts/test-news.py"
      - "scripts/check-pages.mjs"
      - "second-rolf-api/**"
      - "archive-assist/**"
      - "metaready/**"
      - "lumen-relay/**"
      - "brukerstottejakten/**"
      - "vedtak/**"
      - "noark-assistent/**"
      - "arkivmuseet/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v6

      - name: Sett opp Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Kjør tester for Second Rolf
        working-directory: ./second-rolf-api
        run: npm ci && npm test && npm run check

      - name: Kjør tester for Archive Assist
        working-directory: ./archive-assist
        run: npm test && npm run build

      - name: Kjør tester for MetaReady
        working-directory: ./metaready
        run: npm test

      - name: Kjør tester for Lumen Relay
        working-directory: ./lumen-relay
        run: npm test && npm run check

      - name: Kjør tester for Brukerstøttejakten
        working-directory: ./brukerstottejakten
        run: npm test && npm run check

      - name: Kjør tester for VEDTAK!
        working-directory: ./vedtak
        run: npm test && npm run check

      - name: Kjør tester for Noark 5-arkivassistenten
        working-directory: ./noark-assistent
        run: npm run validate

      - name: Sett opp pnpm for Arkivmuseet
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Valider og bygg Arkivmuseet
        working-directory: ./arkivmuseet
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Test Fagstrøm
        run: python3 scripts/test-news.py

      - name: Oppdater fagnyheter fra RSS
        run: python3 scripts/build-news.py

      - name: Sett sammen den statiske siden
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp -R archive-assist/dist _site/archive-assist
          cp -R metaready _site/metaready
          cp -R lumen-relay _site/lumen-relay
          cp -R brukerstottejakten _site/brukerstottejakten
          cp -R vedtak _site/vedtak
          cp -R noark-assistent _site/noark-assistent
          cp -R arkivmuseet/dist _site/arkivmuseet
          # Unpublished from Pages only; the original project files are retained.
          rm -rf _site/fjordsprint _site/fjordsprint-card.css
          rm -rf _site/metaready/tests _site/metaready/package.json _site/metaready/README.md
          rm -rf _site/lumen-relay/tests _site/lumen-relay/package.json _site/lumen-relay/README.md _site/lumen-relay/DESIGN.md _site/lumen-relay/LICENSE
          rm -rf _site/brukerstottejakten/tests _site/brukerstottejakten/package.json _site/brukerstottejakten/README.md
          rm -rf _site/vedtak/tests _site/vedtak/package.json _site/vedtak/README.md _site/vedtak/assets/ART-PROMPTS.txt
          rm -rf _site/noark-assistent/tests _site/noark-assistent/package.json _site/noark-assistent/README.md
          touch _site/.nojekyll

      - name: Kontroller at avpubliserte spill ikke er med
        run: |
          test ! -e _site/fjordsprint
          test ! -e _site/fjordsprint-card.css
          if grep -qi 'fjordsprint' _site/index.html; then
            echo "::error::Fjordsprint must not be linked from the public homepage."
            exit 1
          fi

      - name: Kontroller sidelenker og ressursstier etter bygging
        run: node scripts/check-pages.mjs

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp siden
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publiser siden
        id: deployment
        uses: actions/deploy-pages@v4
