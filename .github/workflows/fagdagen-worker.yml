name: Temporary Fagdagen web deployment

on:
  push:
    branches: [fagdagen-web-2026]
    paths:
      - 'fagdagen-web-2026/**'
      - '.github/workflows/fagdagen-worker.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: fagdagen-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: fagdagen-web-2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Link this deployment run
        run: node ci/report-status.mjs pending
        env:
          FAGDAG_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare browser assets
        run: |
          npm install --no-fund --no-audit
          npm run build
      - name: Deploy and verify temporary Worker
        run: node ci/deploy-temporary.mjs
      - name: Report deployment result
        if: always()
        run: node ci/report-status.mjs '${{ job.status }}'
        env:
          FAGDAG_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

