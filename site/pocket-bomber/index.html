'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110','E':'111100110100111','F':'111100110100100','G':'011100101101011','H':'101101111101101','I':'111010010010111','J':'001001001101010','K':'101101110101101','L':'100100100100111','M':'101111111101101','N':'101111111111101','O':'010101101101010','P':'110101110100100','Q':'010101101111011','R':'110101110101101','S':'011100010001110','T':'111010010010010','U':'101101101101111','V':'101101101101010','W':'101101111111101','X':'101101010101101','Y':'101101010010010','Z':'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',':':'000010000010000','/':'001001010100100','-':'000000111000000','+':'000010111010000','!':'010010010000010','.':'000000000000010',' ':'000000000000000'};
function rect(x,y,w,h,c){ctx.fillStyle=C[c];ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function text(str,x,y,c=3,scale=1){for(const a of String(str).toUpperCase()){const bits=font[a]||font[' '];for(let n=0;n<15;n++)if(bits[n]==='1')rect(x+(n%3)*scale,y+Math.floor(n/3)*scale,scale,scale,c);x+=4*scale;}}
function sprite(rows,x,y,scale=1){for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++)if(rows[j][i]!=='.')rect(x+i*scale,y+j*scale,scale,scale,Number(rows[j][i]));}
const hero=['.....3333.....','....310013....','...31000013...','..3300000033..','..3022222203..','..3020330203..','..3020330203..','...30000003...','..3332222333..','.303322233303.','.303322233303.','..3333333333..','...32233223...','...333..333...'];
const orb=['....33333....','..331111133..','.31100000113.','3310303030133','3100303030013','3100000000013','3100033300013','3311000001133','.33111111133.','..333333333..','...33...33...'];
const crab=['.33.......33.','3133.....3313','.31333333313.','..321111123..','.32201110223.','3323030303233','3223000003223','.3321111233..','..333333333..','.33..3.3..33.'];
const ghost=['....33333....','...3111113...','..310000013..','.31000000013.','.31033033013.','.31033033013.','.31000000013.','.31100300113.','.32111111123.','.32323232323.','..3.3.3.3.3..'];
const bombSprite=['.........13...','........3103..','.......31.3...','.....3333.....','...33111133...','..3100333333..','.310033333333.','.310333333333.','.313333333333.','.313333333333.','.313333333333.','..3333333333..','...33333333...','.....3333.....'];
function beep(f,d=.1,type='square',volume=.035,end){
 if(!sound||!audio||audio.state!=='running')return;
 const o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);
 if(end)o.frequency.exponentialRampToValueAtTime(end,audio.currentTime+d);
 v.gain.setValueAtTime(volume,audio.currentTime);v.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);
 o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+d);
}
function unlock(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});}catch{}}
function fx(t){
 if(t==='plant')beep(190,.1,'square',.03,95);
 if(t==='boom'){beep(70,.26,'sawtooth',.045,20);shake=reduced?0:3;}
 if(t==='enemy')beep(440,.18,'square',.025,110);
 if(t==='pickup'||t==='shield'){beep(660,.14);setTimeout(()=>beep(990,.2),80);}
 if(t==='die')beep(300,.7,'sawtooth',.035,35);
 if(t==='clear'||t==='stage')[330,440,554,660].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*90));
}
function save(){if(g.score>best){best=g.score;try{localStorage.setItem('pocket-bomber-best',String(best));}catch{}}}
function notify(t,d=3){$('tip').textContent=t;tipTimer=d;}
function draw(){
 ctx.save();ctx.imageSmoothingEnabled=false;rect(0,0,208,208,0);
 text('SCORE '+String(g.score).padStart(6,'0'),5,4);text('STAGE '+g.level+'/5',161,4);
 text('LIFE '+g.lives,5,15);text('B '+g.capacity,43,15);text('FIRE '+g.range,69,15);text(g.shield?'SHIELD':'',109,15);
 text('TIME '+String(Math.ceil(g.timer)).padStart(3,'0'),171-4,15,g.timer<30&&Math.floor(g.age*3)%2?2:3);
 rect(0,25,208,1,3);text('FOES '+g.enemies.filter(e=>e.alive).length,5,27,2);text('EXIT: '+(!g.enemies.some(e=>e.alive)?'OPEN':'LOCKED'),130,27,2);
 if(shake>0){ctx.translate(Math.round(Math.sin(g.age*91)*shake),0);shake*=.83;if(shake<.2)shake=0;}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const sx=x*16,sy=32+y*16,v=g.at(x,y);
  if(v===1){
   rect(sx,sy,16,16,3);rect(sx+1,sy+1,14,14,2);rect(sx+2,sy+1,12,2,1);rect(sx+1,sy+3,2,10,1);
   rect(sx+4,sy+5,8,7,2);rect(sx+13,sy+4,1,10,3);rect(sx+4,sy+13,9,1,3);rect(sx+4,sy+4,2,1,0);
  }else if(v===2){
   rect(sx+1,sy+1,14,14,3);rect(sx+2,sy+2,12,12,1);rect(sx+2,sy+2,12,1,0);
   rect(sx+2,sy+7,12,1,3);rect(sx+7,sy+2,1,5,2);rect(sx+4,sy+8,1,6,3);rect(sx+11,sy+8,1,6,2);rect(sx+2,sy+13,12,1,2);
   if(x===g.exit.x&&y===g.exit.y){rect(sx+9,sy+2,5,5,3);rect(sx+11,sy+3,1,3,0);rect(sx+10,sy+4,3,1,0);}
  }else{
   rect(sx,sy,16,16,0);if((x+y)%3===0){rect(sx+3,sy+5,1,1,1);rect(sx+11,sy+12,1,1,1);}
  }
 }
 const ex=g.exit.x*16,ey=g.exit.y*16+32,open=!g.enemies.some(e=>e.alive);
 if(g.at(g.exit.x,g.exit.y)===0){
  rect(ex+2,ey+1,12,15,3);rect(ex+4,ey+3,8,11,open?1:2);rect(ex+10,ey+8,1,2,0);
  if(open){rect(ex+5,ey+4,6,9,0);sprite(['.3.','333','.3.','.3.'],ex+6,ey+6);}
 }
 for(const p of g.pickups){
  const x=p.x*16+3,y=p.y*16+35;rect(x,y,11,11,3);rect(x+1,y+1,9,9,0);
  text({bomb:'B',fire:'F',boot:'S',shield:'+'}[p.type],x+3,y+3,3);
 }
 for(const d of g.debris){let k=(.45-d.t)*14;for(let i=0;i<4;i++)rect(d.x*16+7+(i%2?1:-1)*k,d.y*16+39+(i<2?-1:1)*k,2,2,2);}
 for(const b of g.bombs){const pulse=!reduced&&Math.floor(g.age*(b.fuse<.8?10:4))%2;sprite(bombSprite,b.x*16+1,b.y*16+33-pulse);if(b.fuse<.7)rect(b.x*16+10,b.y*16+32,2,2,0);}
 for(const f of g.flames){
  let x=f.x*16,y=f.y*16+32;rect(x+5,y,6,16,3);rect(x,y+5,16,6,3);rect(x+6,y,4,16,1);rect(x,y+6,16,4,1);
  rect(x+6,y+3,4,10,0);rect(x+3,y+6,10,4,0);if(Math.floor(g.age*8)%2){rect(x+2,y+2,2,2,2);rect(x+12,y+12,2,2,2);}
 }
 for(const e of g.enemies)if(e.alive){const x=(e.px+(e.x-e.px)*e.anim)*16+1,y=(e.py+(e.y-e.py)*e.anim)*16+35;
  sprite([orb,crab,ghost][e.kind],x,y+(!reduced?Math.floor(g.age*3+e.x)%2:0));}
 const p=g.player;if(g.phase!=='dead'&&g.phase!=='over'&&(g.invuln<=0||Math.floor(g.age*9)%2===0)){
  const x=(p.px+(p.x-p.px)*p.anim)*16+1,y=(p.py+(p.y-p.py)*p.anim)*16+33;
  if(g.shield){rect(x,y-1,14,1,2);rect(x,y+14,14,1,2);}sprite(hero,x,y);
 }
 ctx.restore();
}
const mascot='<svg class="mascot" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="#21392f" d="M9 0h4v2h-2v3h2v2h2v6h-2v2H4v-2H2V7h2V5h4V2h1z"/><path fill="#8fac62" d="M5 6h4v2H6v3H4V8h1z"/><path fill="#c7d89b" d="M5 6h2v2H5z"/></svg>';
function show(mode){
 overlayMode=mode;const el=$('overlay');input=-1;clearHeld();
 if(!mode){el.hidden=true;return;}el.hidden=false;
 let html='';
 if(mode==='title')html=`<div class="kicker">THE LITTLE BLAST THAT COULD</div>${mascot}<h1 id="dialog-title">POCKET<br>BOMBER</h1><p>Blast blocks. Dodge trouble.<br>Five stages. One tiny hero.</p><button class="play" data-act="start">START GAME</button><button class="ghost" data-act="help">HOW TO PLAY</button><div class="kicker">BEST ${String(best).padStart(6,'0')}</div>`;
 if(mode==='help')html=`<div class="kicker">FIELD MANUAL</div><h2 id="dialog-title">BOMB &amp; RUN</h2><div class="help-text"><p><b>MOVE:</b> Hold or slide on the D-pad.</p><p><b>B:</b> Drop a bomb. It bursts after 2.35 seconds. Your own blasts hurt!</p><p><b>HIDE:</b> Turn a corner behind stone. Blasts travel in straight lines.</p><p><b>COLLECT:</b> B = more bombs; F = longer fire; S = speed; + = shield.</p><p><b>ESCAPE:</b> Beat every enemy, break the + marked crate, enter its door.</p></div><button class="play" data-act="back">GOT IT</button>`;
 if(mode==='pause')html=`<div class="kicker">TAKE A BREATHER</div>${mascot}<h2 id="dialog-title">PAUSED</h2><p>Stage ${g.level} / 5 &nbsp; · &nbsp; ${g.lives} lives</p><button class="play" data-act="resume">KEEP PLAYING</button><button class="ghost" data-act="help">HOW TO PLAY</button>`;
 if(mode==='dead'||mode==='over')html=`<div class="kicker">${mode==='dead'?'CAUGHT IN THE CHAOS':'END OF THE RUN'}</div>${mascot}<h2 id="dialog-title">${mode==='dead'?'ONE LIFE DOWN':'GAME OVER'}</h2><p>${g.reason}<br>${mode==='dead'?g.lives+' lives left. Watch your escape route.':'Another run. Another chance.'}</p><div class="statline">SCORE ${g.score} &nbsp; BEST ${best}</div><button class="play" data-act="${mode==='dead'?'retry':'restart'}">${mode==='dead'?'TRY STAGE AGAIN':'PLAY AGAIN'}</button>`;
 if(mode==='clear'||mode==='won')html=`<div class="kicker">${mode==='won'?'ALL FIVE STAGES COMPLETE':'EXIT SECURED'}</div>${mascot}<h2 id="dialog-title">${mode==='won'?'POCKET LEGEND!':'STAGE CLEAR!'}</h2><p>${mode==='won'?'You turned a tiny fuse into a big win.':'Bigger mazes. Shorter tempers.'}</p><div class="statline">SCORE ${g.score} &nbsp; LIVES ${g.lives}</div><button class="play" data-act="${mode==='won'?'restart':'next'}">${mode==='won'?'PLAY AGAIN':'STAGE '+(g.level+1)+' →'}</button>`;
 el.innerHTML=html;
}
function pause(){if(g.phase==='playing'){g.phase='pause';show('pause');}else if(g.phase==='pause'){g.phase='playing';show('');}}
function help(){wasPlaying=g.phase==='playing'||g.phase==='pause';if(g.phase==='playing')g.phase='pause';show('help');}
$('overlay').addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;unlock();
 const a=b.dataset.act;
 if(a==='start'){g.start();show('');notify('B drops a bomb. Get around a stone corner before it bursts!',7);}
 if(a==='help')help();
 if(a==='back'){if(wasPlaying){g.phase='playing';show('');}else show(g.phase==='title'?'title':g.phase);}
 if(a==='resume'){g.phase='playing';show('');}
 if(a==='retry'){g.retry();show('');}
 if(a==='restart'){g=new Game();g.start();show('');notify('A fresh maze. Leave yourself an escape route.',4);}
 if(a==='next'){g.next();show('');}
});
const held=new Map();let padPointer=null;
function clearHeld(){held.clear();input=-1;padPointer=null;document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed'));}
function setDir(d){input=d;document.querySelectorAll('[data-dir]').forEach(b=>b.classList.toggle('pressed',Number(b.dataset.dir)===d));}
const pad=$('dpad');
function padDir(e){const r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
 if(Math.max(Math.abs(dx),Math.abs(dy))<15)return -1;
 return Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0;
}
pad.addEventListener('pointerdown',e=>{e.preventDefault();if(padPointer!==null)return;padPointer=e.pointerId;pad.setPointerCapture(e.pointerId);setDir(padDir(e));if(input>=0)g.move(input);});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padPointer){e.preventDefault();setDir(padDir(e));}});
function releasePad(e){if(e.pointerId===padPointer){padPointer=null;setDir(-1);}}
pad.addEventListener('pointerup',releasePad);pad.addEventListener('pointercancel',releasePad);pad.addEventListener('lostpointercapture',releasePad);
$('bomb').addEventListener('pointerdown',e=>{e.preventDefault();unlock();$('bomb').setPointerCapture(e.pointerId);$('bomb').classList.add('pressed');g.plant();});
for(const name of ['pointerup','pointercancel','lostpointercapture'])$('bomb').addEventListener(name,()=>$('bomb').classList.remove('pressed'));
$('bomb').addEventListener('click',e=>{if(e.detail===0){unlock();g.plant();}});
// Semantic buttons also work with keyboard activation and assistive technology.
pad.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{if(e.detail===0)g.move(Number(b.dataset.dir));}));
const keys={ArrowUp:0,w:0,W:0,ArrowRight:1,d:1,D:1,ArrowDown:2,s:2,S:2,ArrowLeft:3,a:3,A:3};
window.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.key in keys){e.preventDefault();held.delete(e.code);held.set(e.code,keys[e.key]);setDir(keys[e.key]);if(!e.repeat)g.move(input);}
 if([' ','z','Z','b','B'].includes(e.key)&&g.phase==='playing'){e.preventDefault();if(!e.repeat){unlock();g.plant();}}
 if(['p','P','Escape'].includes(e.key)&&!e.repeat){e.preventDefault();pause();}
});
window.addEventListener('keyup',e=>{if(e.key in keys){held.delete(e.code);setDir(held.size?[...held.values()].at(-1):-1);}});
$('pause').onclick=()=>pause();$('help').onclick=()=>help();
$('sound').onclick=()=>{sound=!sound;unlock();$('sound').innerHTML='SFX<br>'+(sound?'ON':'OFF');$('sound').setAttribute('aria-label',sound?'Mute sound effects':'Enable sound effects');if(sound)beep(440);};
$('full').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();if(p)p.catch(()=>notify('Fullscreen is not available in this browser.'));else notify('Fullscreen is not available in this browser.');}catch{notify('Fullscreen is not available in this browser.');}};
function suspend(){clearHeld();if(g.phase==='playing'){g.phase='pause';show('pause');}save();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();});window.addEventListener('blur',suspend);
for(const el of [pad,$('bomb'),canvas])el.addEventListener('contextmenu',e=>e.preventDefault());
function frame(now){
 const dt=Math.min(.05,(now-(lastTime||now))/1000);lastTime=now;g.step(dt,input);
 for(const e of g.events){fx(e.type);if(e.type==='pickup')notify({bomb:'BOMB UP! You can place '+g.capacity+' bombs.',fire:'FIRE UP! Blasts reach '+g.range+' tiles. Watch out!',boot:'SPEED UP! Quicker feet, same fuse.',shield:'SHIELD! One hit absorbed.'}[e.item]);if(e.type==='shield')notify('Shield used. Brief protection — get clear!');if(e.type==='clear'||e.type==='die')save();}
 g.events.length=0;
 if(g.phase!==lastPhase){lastPhase=g.phase;if(!['playing','pause'].includes(g.phase)&&overlayMode!=='help')show(g.phase);}
 if(g.phase==='playing'){
  tipTimer-=dt;if(tipTimer<=0){const left=g.enemies.filter(e=>e.alive).length;
   const t=left?left+' enemies left. Hold D-pad to move. Tap B to bomb.':'EXIT OPEN! Break the + crate and enter the door.';
   if($('tip').textContent!==t)$('tip').textContent=t;
  }
 }
 draw();requestAnimationFrame(frame);
}
show('title');requestAnimationFrame(frame);
// A read-only accessor helps inspect the live engine in browser tests.
Object.defineProperty(window,'pocketBomber',{get:()=>g});
})();

</script>
